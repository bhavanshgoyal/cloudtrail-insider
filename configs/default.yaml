# ── cloudtrail-insider / configs/default.yaml ────────────────────────────────
# Every module imports cti.util.config.load_config() and reads values from here.
# No literal magic numbers anywhere in source code.

paths:
  raw_logs:          "data/raw/cloudtrail_logs.jsonl.gz"
  processed_events:  "data/processed/events.parquet"
  principals:        "data/interim/principals.parquet"
  feature_store:     "data/features/features.parquet"
  label_store:       "data/features/labels.parquet"
  ground_truth:      "data/raw/ground_truth.json"
  results_dir:       "results"
  models_dir:        "models"
  figures_dir:       "figures"

random_seed: 42

# Causal windowing — Phase 1 leakage test enforces these
warmup_days:               14
calibration_window_events: 2000
calibration_window_days:   30
min_calibration_events:    50
session_gap_minutes:       30

budgets: [10, 50, 100]

max_alerts_per_principal_day: 1
max_alerts_per_role:          5
suppress_days:                3

# Relative, rolling-origin temporal splits (see cti.util.splits).
# The first `warmup_days` days are history only: never trained on, never scored.
# Windows are expressed as fractions of the usable (post-warmup) days.
#   test  = last test_frac of the window for each origin
#   val   = val_frac of usable days immediately before test (tuning ONLY here)
#   train = everything usable before val (expanding window)
# `n_origins` rolling origins shift the test window back by test_len // n_origins.
splits:
  val_frac:        0.15
  test_frac:       0.25
  n_origins:       3
  min_train_days:  30
  min_test_insiders: 8

features:
  entity_columns: ["principalId"]
  time_bucket_hours: 1
  rare_event_threshold: 5
  dirichlet_alpha: 0.1
  peer_group_backoff_lambda: 0.5
  privilege_escalating_actions:
    - "CreateAccessKey"
    - "AssumeRole"
    - "PutBucketPolicy"
    - "PutBucketAcl"
    - "ModifySnapshotAttribute"
    - "DeleteTrail"
    - "StopLogging"
  sensitive_resource_prefixes:
    - "finance-"
    - "hr-"
    - "security-"
    - "pii-"

detectors:
  isolation_forest:
    n_estimators:   200
    contamination:  0.02
    max_features:   1.0
    bootstrap:      false
  isolation_forest_per_principal:
    n_estimators:   100
    contamination:  0.05
    max_features:   1.0
    min_events:     50
  lof:
    n_neighbors:    20
    contamination:  0.02
  one_class_svm:
    kernel:         "rbf"
    nu:             0.05
  autoencoder:
    hidden_dims:    [32, 16, 8, 16, 32]
    epochs:         200
    batch_size:     256
    lr:             0.001
  proposed:
    fusion_method:  "fisher"     # fisher | min_p | harmonic_mean
    incident_aggregation: "fisher"  # max | topk_mean | fisher
    n_estimators:   100
    contamination:  0.05
    min_events:     30

rules_cfg:
  rules_file: "configs/rules.yaml"

eval:
  metrics: ["detection_rate_at_b", "precision_at_b", "insider_recall_at_b", "mttd_at_b"]
  bootstrap_iterations: 10000
  bootstrap_method:     "BCa"
  confidence_level:     0.95
  resample_unit:        "day"   # resample over days, not events

explain:
  top_k_features:    3
  shap_max_display:  20
  background_samples: 100
  surrogate_fidelity_floor: 0.7

synthetic:
  start_date: "2023-01-01"
  default_workload: "W1_baseline"
  # Role mix and per-role volume (events/day) ranges.
  role_weights: {analyst: 0.30, developer: 0.30, admin: 0.08, backup-service: 0.12, ci-runner: 0.20}
  scenarios_all: ["S1", "S2", "S3", "S4", "S5"]
  workloads:
    W1_baseline:                       # reference workload
      principals: 1000
      days: 180
      insider_rate: 0.05
      scenario_weights: {S1: 1, S2: 1, S3: 1, S4: 1, S5: 1}
      stealth: 1.0                     # scales planted-attack magnitude
      noise: 1.0                       # scales benign lookalike frequency
    W2_stealthy:                       # low-and-slow attacks, weaker magnitudes
      principals: 1000
      days: 180
      insider_rate: 0.05
      scenario_weights: {S1: 0.5, S2: 2, S3: 0.5, S4: 0.5, S5: 2}
      stealth: 0.5
      noise: 1.0
    W3_scale:                          # more identities
      principals: 3000
      days: 180
      insider_rate: 0.05
      scenario_weights: {S1: 1, S2: 1, S3: 1, S4: 1, S5: 1}
      stealth: 1.0
      noise: 1.0
    W4_noisy:                          # more benign lookalikes, more service accounts
      principals: 1000
      days: 180
      insider_rate: 0.05
      scenario_weights: {S1: 1, S2: 1, S3: 1, S4: 1, S5: 1}
      stealth: 1.0
      noise: 2.5
      role_weights: {analyst: 0.22, developer: 0.28, admin: 0.10, backup-service: 0.15, ci-runner: 0.25}
  fast:                                # python run_pipeline.py --fast (quick sanity check only)
    principals: 200
    days: 100
    insider_rate: 0.20

demo:
  port: 8501
  default_budget: 10
  refresh_seconds: 0

# LocalStack (CloudSim) testbed configuration
localstack:
  endpoint_url: "http://localhost:4566"
  region:       "us-east-1"
  access_key:   "test"
  secret_key:   "test"
  services:     ["cloudtrail", "s3", "iam", "sts", "ec2", "ses", "logs"]

