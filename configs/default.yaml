# ── cloudtrail-insider / configs/default.yaml ────────────────────────────────
# Every module imports cti.util.config.load_config() and reads values from here.
# No literal magic numbers anywhere in source code.

paths:
  feature_store:     "data/cache/CERT_r4.2/features.parquet"
  results_dir:       "results"
  models_dir:        "models"
  figures_dir:       "figures"

random_seed: 42

# CMU SEI CERT Insider Threat Test Dataset (ExactData DDG). Licensed: never commit or share
# raw rows or derived files. Keyword lists are fixed a priori from general security
# knowledge and the public scenario descriptions, never from the answers files.
cert:
  release:      "4.2"
  raw_dir:      "data/raw/cert/r4.2"
  answers_dir:  "data/raw/cert/answers"
  parquet_dir:  "data/processed/cert_r4.2"
  internal_email_domain: "dtaa.com"
  business_hours: [8, 18]           # local time; outside = after hours
  job_site_keywords:  ["job", "career", "monster", "indeed", "simplyhired", "linkedin",
                       "hire", "recruit", "resume", "glassdoor"]
  leak_site_keywords: ["wikileaks", "dropbox", "pastebin", "mediafire", "rapidshare",
                       "megaupload", "4shared", "sendspace", "upload"]
  executable_extensions: ["exe", "bat", "dll", "msi", "vbs", "ps1"]

# Causal windowing: the first warmup_days are history only (never trained on, never scored)
warmup_days:               14

budgets: [10, 50, 100]

max_alerts_per_principal_day: 1

# Relative, rolling-origin temporal splits (see cti.util.splits).
# The first `warmup_days` days are history only: never trained on, never scored.
# Windows are expressed as fractions of the usable (post-warmup) days.
#   test  = last test_frac of the window for each origin
#   val   = val_frac of usable days immediately before test (tuning ONLY here)
#   train = everything usable before val (expanding window)
# `n_origins` rolling origins shift the test window back by test_len // n_origins.
splits:
  val_frac:        0.15
  test_frac:       0.25
  n_origins:       3
  min_train_days:  30
  min_test_insiders: 8

features:
  rare_event_threshold: 5         # a website with fewer prior company-wide visits is "rare"

detectors:
  isolation_forest:
    n_estimators:   200
    contamination:  0.02
    max_features:   1.0
    bootstrap:      false
  isolation_forest_per_principal:
    n_estimators:   100
    contamination:  0.05
    max_features:   1.0
    min_events:     50
  lof:
    n_neighbors:    20
    contamination:  0.02
  one_class_svm:
    kernel:         "rbf"
    nu:             0.05
  autoencoder:
    hidden_dims:    [32, 16, 8, 16, 32]
    epochs:         200
    batch_size:     256
    lr:             0.001
  proposed:
    fusion_method:  "fisher"     # fisher | min_p | harmonic_mean
    incident_aggregation: "fisher"  # max | topk_mean | fisher
    n_estimators:   100
    contamination:  0.05
    min_events:     30

rules_cfg:
  rules_file: "configs/rules.yaml"

eval:
  metrics: ["detection_rate_at_b", "precision_at_b", "insider_recall_at_b", "mttd_at_b"]
  bootstrap_iterations: 10000
  bootstrap_method:     "BCa"
  confidence_level:     0.95
  resample_unit:        "day"   # resample over days, not events

explain:
  top_k_features:    3
  shap_max_display:  20
  background_samples: 100
  surrogate_fidelity_floor: 0.7

demo:
  port: 8501
  default_budget: 10
  refresh_seconds: 0

# LocalStack (CloudSim) testbed configuration
localstack:
  endpoint_url: "http://localhost:4566"
  region:       "us-east-1"
  access_key:   "test"
  secret_key:   "test"
  services:     ["cloudtrail", "s3", "iam", "sts", "ec2", "ses", "logs"]

